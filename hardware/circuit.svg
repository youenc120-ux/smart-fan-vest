<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840">
  <style>
    text { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; fill: #222; }
    .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .v12 { stroke: #d32f2f; }
    .v5 { stroke: #ef6c00; }
    .v33 { stroke: #1565c0; }
    .sig { stroke: #2e7d32; }
    .gnd { stroke: #222; }
    .sw { stroke: #6a1b9a; }
    .box { stroke: #333; stroke-width: 2; }
    .part { fill: #fff; stroke: #333; stroke-width: 2; }
    .dot { fill: #222; }
    .pin { fill: #fff; stroke: #333; stroke-width: 2; }
    .s13 { font-size: 13px; }
    .s14 { font-size: 14px; }
    .s16 { font-size: 16px; }
    .b { font-weight: bold; }
  </style>
  <rect width="1200" height="840" fill="#fff"/>

  <!-- 標題與圖例 -->
  <text x="40" y="62" font-size="32" class="b">智能風扇背心電路圖（實作版）</text>
  <g class="s13">
    <line x1="660" y1="40" x2="690" y2="40" class="w v12"/><text x="696" y="45">+12V 風扇電源</text>
    <line x1="820" y1="40" x2="850" y2="40" class="w v5"/><text x="856" y="45">USB 5V</text>
    <line x1="930" y1="40" x2="960" y2="40" class="w v33"/><text x="966" y="45">3.3V</text>
    <line x1="1020" y1="40" x2="1050" y2="40" class="w sig"/><text x="1056" y="45">訊號</text>
    <line x1="660" y1="68" x2="690" y2="68" class="w gnd"/><text x="696" y="73">GND（全部共地）</text>
    <line x1="820" y1="68" x2="850" y2="68" class="w sw"/><text x="856" y="73">風扇負極（受 Q1 開關）</text>
  </g>

  <!-- 電池 -->
  <rect x="40" y="110" width="200" height="220" rx="10" fill="#eef3fb" class="box"/>
  <text x="120" y="205" text-anchor="middle" font-size="22" class="b">空調服電池</text>
  <text x="120" y="232" text-anchor="middle" class="s14">調速固定最高段</text>
  <text x="230" y="155" text-anchor="end" class="s13">DC +12V</text>
  <text x="230" y="195" text-anchor="end" class="s13">DC −</text>
  <text x="230" y="285" text-anchor="end" class="s13">USB 5V</text>

  <!-- +12V 主線與保險絲 -->
  <path d="M240 150 H300" class="w v12"/>
  <rect x="300" y="138" width="60" height="24" class="part"/>
  <text x="330" y="128" text-anchor="middle" class="s14">F1 保險絲 3A</text>
  <path d="M360 150 H480 M600 150 H1120" class="w v12"/>
  <text x="700" y="140" text-anchor="middle" class="s14" fill="#d32f2f">+12V</text>

  <!-- U1 INA219 電流／電壓感測（串在 +12V 主線上） -->
  <rect x="480" y="125" width="120" height="50" rx="6" fill="#fff3e0" stroke="#333" stroke-width="2"/>
  <text x="540" y="148" text-anchor="middle" class="s14 b">U1 INA219</text>
  <text x="540" y="166" text-anchor="middle" class="s13">VIN+ → VIN−</text>
  <text x="540" y="115" text-anchor="middle" class="s13">電流／電壓感測</text>
  <path d="M520 175 V380" class="w sig"/>
  <path d="M560 175 V380" class="w sig" stroke-dasharray="7 5"/>
  <text x="514" y="235" text-anchor="end" class="s13">SDA</text>
  <text x="566" y="235" class="s13">SCL</text>
  <text x="510" y="200" text-anchor="end" class="s13">VCC 接 3V3、GND 共地</text>

  <!-- 電池 DC− 接地 -->
  <path d="M240 190 H270 V215" class="w gnd"/>
  <path d="M255 215 H285 M261 222 H279 M267 229 H273" class="w gnd" stroke-width="2.5"/>

  <!-- USB 5V 到 ESP32 -->
  <path d="M240 280 H460 V380" class="w v5"/>
  <text x="350" y="270" text-anchor="middle" class="s14">USB 線（5V）</text>

  <!-- 風扇 1~4（並聯） -->
  <defs><g id="fan">
    <path d="M0 -50 V0" class="w v12"/>
    <rect x="-35" y="0" width="70" height="110" rx="8" class="part"/>
    <circle cx="0" cy="42" r="24" class="part"/>
    <text x="0" y="49" text-anchor="middle" font-size="18" class="b">M</text>
    <text x="6" y="-6" class="s14 b">+</text>
    <text x="6" y="130" class="s14 b">−</text>
    <path d="M0 110 V170" class="w sw"/>
  </g></defs>
  <use href="#fan" x="880" y="200"/>
  <use href="#fan" x="960" y="200"/>
  <use href="#fan" x="1040" y="200"/>
  <use href="#fan" x="1120" y="200"/>
  <text x="880" y="295" text-anchor="middle" class="s13">風扇1</text>
  <text x="960" y="295" text-anchor="middle" class="s13">風扇2</text>
  <text x="1040" y="295" text-anchor="middle" class="s13">風扇3</text>
  <text x="1120" y="295" text-anchor="middle" class="s13">風扇4</text>
  <path d="M760 370 H1120" class="w sw"/>
  <text x="1000" y="394" text-anchor="middle" class="s13">四顆 12V 風扇並聯 → 風扇負極</text>
  <circle cx="880" cy="150" r="5" class="dot"/>
  <circle cx="960" cy="150" r="5" class="dot"/>
  <circle cx="1040" cy="150" r="5" class="dot"/>
  <circle cx="880" cy="370" r="5" class="dot"/>
  <circle cx="960" cy="370" r="5" class="dot"/>
  <circle cx="1040" cy="370" r="5" class="dot"/>

  <!-- D1 飛輪二極體（陰極朝上接 +12V） -->
  <path d="M800 150 V250 M800 280 V370" class="w"  stroke="#333"/>
  <polygon points="785,280 815,280 800,252" fill="#fff" stroke="#333" stroke-width="2"/>
  <line x1="785" y1="250" x2="815" y2="250" stroke="#333" stroke-width="3"/>
  <text x="780" y="262" text-anchor="end" class="s14">D1 1N5819</text>
  <text x="780" y="280" text-anchor="end" class="s13">白環端接 +12V</text>
  <circle cx="800" cy="150" r="5" class="dot"/>
  <circle cx="800" cy="370" r="5" class="dot"/>

  <!-- Q1 N-MOSFET（低側開關） -->
  <path d="M760 370 V425 H745" class="w sw"/>
  <path d="M745 475 H760 V640" class="w gnd"/>
  <path d="M753 450 H760 V475" fill="none" stroke="#333" stroke-width="2"/>
  <polygon points="746,450 755,444 755,456" fill="#333"/>
  <line x1="745" y1="413" x2="745" y2="487" stroke="#333" stroke-width="3"/>
  <line x1="733" y1="425" x2="733" y2="475" stroke="#333" stroke-width="3"/>
  <text x="768" y="412" class="s13">D</text>
  <text x="768" y="500" class="s13">S</text>
  <text x="722" y="440" class="s13">G</text>
  <text x="780" y="440" class="s14 b">Q1 N-MOSFET</text>
  <text x="780" y="460" class="s13">D4184 模組（4 顆風扇建議用模組）</text>
  <text x="780" y="480" class="s13">低側開關：接在風扇負極</text>

  <!-- R1、R2 -->
  <path d="M560 450 H600" class="w sig"/>
  <rect x="600" y="440" width="60" height="20" class="part"/>
  <text x="630" y="432" text-anchor="middle" class="s13">R1 100Ω</text>
  <path d="M660 450 H733" class="w sig"/>
  <circle cx="700" cy="450" r="5" class="dot"/>
  <path d="M700 450 V510" class="w sig"/>
  <rect x="690" y="510" width="20" height="60" class="part"/>
  <text x="682" y="537" text-anchor="end" class="s13">R2 10kΩ</text>
  <text x="682" y="555" text-anchor="end" class="s13">（G–S 下拉）</text>
  <path d="M700 570 V640" class="w gnd"/>
  <path d="M685 640 H715 M691 647 H709 M697 654 H703" class="w gnd" stroke-width="2.5"/>
  <path d="M745 640 H775 M751 647 H769 M757 654 H763" class="w gnd" stroke-width="2.5"/>

  <!-- ESP32 -->
  <rect x="360" y="380" width="200" height="250" rx="10" fill="#e3f2fd" class="box"/>
  <text x="460" y="402" text-anchor="middle" class="s13">USB</text>
  <text x="520" y="420" text-anchor="middle" class="s13">21</text>
  <text x="555" y="420" text-anchor="end" class="s13">22</text>
  <circle cx="520" cy="380" r="5" class="pin"/>
  <circle cx="560" cy="380" r="5" class="pin"/>
  <text x="460" y="445" text-anchor="middle" font-size="24" class="b">ESP32</text>
  <text x="460" y="470" text-anchor="middle" class="s14">開發板</text>
  <text x="550" y="455" text-anchor="end" class="s14">GPIO25</text>
  <text x="550" y="473" text-anchor="end" class="s13">（PWM）</text>
  <text x="370" y="505" class="s14">3V3</text>
  <text x="370" y="545" class="s14">GPIO4</text>
  <text x="370" y="585" class="s14">GND</text>
  <path d="M460 630 V660" class="w gnd"/>
  <path d="M445 660 H475 M451 667 H469 M457 674 H463" class="w gnd" stroke-width="2.5"/>

  <!-- DS18B20 -->
  <rect x="40" y="460" width="190" height="150" rx="10" fill="#eef8ee" class="box"/>
  <text x="95" y="530" text-anchor="middle" class="s16 b">DS18B20</text>
  <text x="95" y="555" text-anchor="middle" class="s14">溫度感測器</text>
  <text x="220" y="505" text-anchor="end" class="s13">VCC</text>
  <text x="220" y="545" text-anchor="end" class="s13">DQ</text>
  <text x="220" y="585" text-anchor="end" class="s13">GND</text>
  <path d="M230 500 H360" class="w v33"/>
  <path d="M230 540 H360" class="w sig"/>
  <path d="M230 580 H360" class="w gnd"/>
  <!-- R3 上拉 -->
  <path d="M300 500 V506 M300 534 V540" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="293" y="506" width="14" height="28" class="part"/>
  <text x="314" y="525" class="s13">R3 4.7kΩ</text>
  <circle cx="300" cy="500" r="4.5" class="dot"/>
  <circle cx="300" cy="540" r="4.5" class="dot"/>

  <!-- 腳位端點 -->
  <g>
    <circle cx="240" cy="150" r="5" class="pin"/>
    <circle cx="240" cy="190" r="5" class="pin"/>
    <circle cx="240" cy="280" r="5" class="pin"/>
    <circle cx="460" cy="380" r="5" class="pin"/>
    <circle cx="560" cy="450" r="5" class="pin"/>
    <circle cx="360" cy="500" r="5" class="pin"/>
    <circle cx="360" cy="540" r="5" class="pin"/>
    <circle cx="360" cy="580" r="5" class="pin"/>
    <circle cx="460" cy="630" r="5" class="pin"/>
    <circle cx="230" cy="500" r="5" class="pin"/>
    <circle cx="230" cy="540" r="5" class="pin"/>
    <circle cx="230" cy="580" r="5" class="pin"/>
  </g>

  <!-- 接線重點 -->
  <rect x="40" y="695" width="1120" height="130" rx="10" fill="#fffaf0" stroke="#c9a227" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="60" y="725" class="s16 b">接線重點</text>
  <text x="60" y="752" class="s14">① 電池調速固定在最高段，轉速改由 ESP32 的 PWM 控制。　② 所有 GND 必須共地：ESP32 的 GND 要接到 Q1 的 S 極（電池 DC−）。</text>
  <text x="60" y="777" class="s14">③ D1 有白環的那端（陰極）接 +12V。　④ 腳位：GPIO25 = PWM、GPIO4 = 溫度、GPIO21/22 = INA219 SDA/SCL。</text>
  <text x="60" y="802" class="s14">⑤ 用 D4184 模組時：VIN+/VIN− 接電池、OUT+/OUT− 接風扇、PWM/GND 接 ESP32；模組內已含 Q1、R1、R2，D1 仍需外加。</text>
</svg>
